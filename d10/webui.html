<title>mrkai — Sliding Window vs Sticky Facts</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0e1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --dim: #6e7681;
    --accent: #58a6ff;
    --user: #1f6feb;
    --error: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--dim);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header b { color: var(--text); }
  .cols {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    color: var(--dim);
    font-size: 12px;
  }
  .col {
    flex: 1 1 0;
    min-width: 0;
    padding: 6px 10px;
  }
  .col + .col { border-left: 1px solid var(--border); }
  main {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
  }
  .turn { padding: 0 0 6px; }
  .band {
    padding: 8px 10px 10px;
    margin-bottom: 4px;
  }
  .band-rule {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--user);
    font-weight: bold;
  }
  .band-rule::before,
  .band-rule::after {
    content: "";
    flex: 1 1 0;
    border-top: 1px solid var(--user);
    opacity: .5;
  }
  .band-text {
    text-align: center;
    color: var(--user);
    white-space: pre-wrap;
    word-break: break-word;
    padding-top: 6px;
  }
  .row { display: flex; align-items: flex-start; }
  .block { white-space: pre-wrap; word-break: break-word; margin: 2px 0; }
  .block.assistant { color: var(--text); }
  .block.info { color: var(--dim); }
  .answer { text-align: center; }
  .label { color: var(--dim); font-size: 11px; }
  .spinner { color: var(--dim); }
  .spinner .dots span { animation: blink 1.4s infinite; }
  .spinner .dots span:nth-child(2) { animation-delay: .2s; }
  .spinner .dots span:nth-child(3) { animation-delay: .4s; }
  .spin-text { margin-left: 6px; }
  @keyframes blink {
    0%, 60%, 100% { opacity: .25; }
    30% { opacity: 1; }
  }
  .statusbar {
    display: flex;
    border-top: 1px solid var(--border);
    color: var(--dim);
  }
  .statusbar .col { white-space: pre-wrap; word-break: break-word; }
  footer {
    border-top: 1px solid var(--border);
    padding: 8px 12px;
    position: relative;
  }
  #menu {
    position: absolute;
    bottom: 100%;
    left: 12px;
    right: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom: none;
    max-height: 180px;
    overflow-y: auto;
    display: none;
  }
  #menu.open { display: block; }
  #menu div {
    padding: 4px 8px;
    cursor: pointer;
  }
  #menu div.active, #menu div:hover { background: var(--accent); color: #0e1117; }
  #input {
    width: 100%;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    font: inherit;
    padding: 8px;
  }
  #input:focus { outline: none; border-color: var(--accent); }
</style>
<header>
  <div><b>mrkai</b> — веб-версия: Sliding Window vs Sticky Facts / Key-Value Memory</div>
  <div>Введите <b>/</b> для списка команд · Enter — отправить · ↑/↓ — история</div>
</header>
<div class="cols">
  <div class="col" id="label-window">Sliding Window</div>
  <div class="col" id="label-facts">Sticky Facts / Key-Value Memory</div>
</div>
<main id="log"></main>
<div class="statusbar">
  <div class="col" id="status-window"></div>
  <div class="col" id="status-facts"></div>
</div>
<footer>
  <div id="menu"></div>
  <input id="input" autocomplete="off" placeholder="Сообщение или команда, начинающаяся с /…" />
</footer>
<script>
const SIDES = ["window", "facts"];
const log = document.getElementById("log");
const statuses = { window: document.getElementById("status-window"), facts: document.getElementById("status-facts") };
const labels = { window: document.getElementById("label-window"), facts: document.getElementById("label-facts") };
const input = document.getElementById("input");
const menu = document.getElementById("menu");

const SLASH_COMMANDS = [
  "/contextManagementStrategy", "/addBranch ", "/branch", "/checkpoint ",
  "/memory", "/facts", "/context", "/stats", "/sendNext",
  "/fill ", "/overflow ", "/reset", "/info",
];

let history = [];
let historyPos = -1;
let busy = false;
let menuIndex = -1;
let menuItems = [];

// Structured like the terminal's comparison view: every panel holds a flat list
// of blocks, and a "user" block opens a turn that both panels answer into.
let panes = [
  { label: "Sliding Window", blocks: [], status: "" },
  { label: "Sticky Facts / Key-Value Memory", blocks: [], status: "" },
];
// Live answer nodes, so streamed chunks patch one element instead of repainting
// the whole transcript on every token.
let liveNodes = {};
// Panels whose answer has not produced its first chunk yet: they show a loader
// instead of an empty answer, and drop it on the chunk that replaces it.
const waiting = { window: false, facts: false };
let spinnerNodes = {};
let waitStart = 0;
let waitTimer = null;

function waitLabel() {
  return "• Working (" + formatElapsed(Date.now() - waitStart) + ")";
}

function formatElapsed(ms) {
  const seconds = Math.floor(ms / 1000);
  if (seconds < 60) return seconds + "s";
  return Math.floor(seconds / 60) + "m " + (seconds % 60) + "s";
}

function startWaiting() {
  SIDES.forEach((side) => { waiting[side] = true; });
  waitStart = Date.now();
  if (waitTimer === null) waitTimer = setInterval(tickWait, 1000);
}

function stopWaiting() {
  SIDES.forEach((side) => { waiting[side] = false; });
  if (waitTimer !== null) {
    clearInterval(waitTimer);
    waitTimer = null;
  }
}

// The counter belongs to the turn, not to one panel: a side that already
// answered still shows how long the turn has been running.
function tickWait() {
  SIDES.forEach((side) => {
    const node = spinnerNodes[side];
    if (node) node.textContent = waitLabel();
  });
}

function spinnerElement() {
  const el = document.createElement("div");
  el.className = "block spinner";
  const dots = document.createElement("span");
  dots.className = "dots";
  for (let i = 0; i < 3; i++) {
    const dot = document.createElement("span");
    dot.textContent = "·";
    dots.appendChild(dot);
  }
  const text = document.createElement("span");
  text.className = "spin-text";
  text.textContent = waitLabel();
  el.append(dots, text);
  return { el, text };
}

function groupTurns(blocks) {
  const turns = [];
  blocks.forEach((block, index) => {
    if (block.role === "user") {
      turns.push({ prompt: block.content, blocks: [] });
      return;
    }
    if (turns.length === 0) turns.push({ prompt: "", blocks: [] });
    turns[turns.length - 1].blocks.push({ index, block });
  });
  return turns;
}

function blockElement(side, index, block) {
  const live = block.role === "assistant" && index === panes[SIDES.indexOf(side)].blocks.length - 1;
  // An answer that never arrived (a failed request) has nothing to show and no
  // stream left to fill it; drawing its empty shell only leaves a stray divider.
  if (block.role === "assistant" && !block.content && !live) return null;
  const wrap = document.createElement("div");
  if (block.role === "assistant") wrap.className = "answer";
  // A failed request leaves an empty answer block; without content it is only
  // worth a label while it is still the block a stream will fill.
  if (block.role === "assistant" && (block.content || live)) {
    const tag = document.createElement("div");
    tag.className = "label";
    tag.textContent = "МОДЕЛЬ";
    wrap.appendChild(tag);
  }
  if (live && waiting[side] && !block.content) {
    const spinner = spinnerElement();
    spinnerNodes[side] = spinner.text;
    wrap.appendChild(spinner.el);
  }
  const el = document.createElement("div");
  el.className = "block " + block.role;
  el.textContent = block.content;
  wrap.appendChild(el);
  if (live) {
    liveNodes[side] = el;
  }
  return wrap;
}

function renderAll() {
  liveNodes = {};
  spinnerNodes = {};
  log.innerHTML = "";
  const turnsBySide = panes.map((pane) => groupTurns(pane.blocks));
  const count = Math.max(...turnsBySide.map((turns) => turns.length), 0);
  for (let i = 0; i < count; i++) {
    const pair = turnsBySide.map((turns) => turns[i] || { prompt: "", blocks: [] });
    const turn = document.createElement("div");
    turn.className = "turn";
    // Both panels receive the same prompt, so it is drawn once across the full
    // width instead of twice in the columns.
    const prompt = pair[0].prompt || pair[1].prompt;
    if (prompt) {
      const band = document.createElement("div");
      band.className = "band";
      const rule = document.createElement("div");
      rule.className = "band-rule";
      rule.innerHTML = "<span>ВЫ</span>";
      const text = document.createElement("div");
      text.className = "band-text";
      text.textContent = prompt;
      band.append(rule, text);
      turn.appendChild(band);
    }
    // A turn whose panels produced nothing (a failed request leaves an empty
    // answer) would otherwise draw a bare column divider.
    const columns = pair.map((side, index) => {
      const col = document.createElement("div");
      col.className = "col";
      side.blocks.forEach((entry) => {
        const node = blockElement(SIDES[index], entry.index, entry.block);
        if (node) col.appendChild(node);
      });
      return col;
    });
    if (columns.some((col) => col.children.length > 0)) {
      const row = document.createElement("div");
      row.className = "row";
      columns.forEach((col) => row.appendChild(col));
      turn.appendChild(row);
    }
    log.appendChild(turn);
  }
  panes.forEach((pane, index) => {
    labels[SIDES[index]].textContent = pane.label;
    statuses[SIDES[index]].textContent = pane.status || "";
  });
  stickToBottom();
}

function stickToBottom() {
  log.scrollTop = log.scrollHeight;
}

function applyState(state) {
  panes = state.panes;
  renderAll();
}

async function fetchState() {
  const res = await fetch("/api/state");
  applyState(await res.json());
}

async function runCommand(line) {
  const res = await fetch("/api/command", { method: "POST", body: JSON.stringify({ line }) });
  if (!res.ok) return;
  const data = await res.json();
  applyState(data);
  if (data.ask) {
    await ask(data.ask);
  }
}

async function ask(prompt) {
  busy = true;
  input.disabled = true;
  // Show the turn immediately; the final fetchState reconciles with the server.
  panes.forEach((pane) => {
    pane.blocks.push({ role: "user", content: prompt });
    pane.blocks.push({ role: "assistant", content: "" });
  });
  startWaiting();
  renderAll();
  try {
    const res = await fetch("/api/ask", { method: "POST", body: JSON.stringify({ prompt }) });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split("\n\n");
      buffer = parts.pop();
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith("data:")) continue;
        handleEvent(JSON.parse(line.slice(5)));
      }
    }
  } finally {
    busy = false;
    input.disabled = false;
    stopWaiting();
    input.focus();
    await fetchState();
  }
}

function handleEvent(event) {
  if (event.type === "done") return;
  const index = SIDES.indexOf(event.side);
  if (index < 0) return;
  if (event.type === "answer") {
    const blocks = panes[index].blocks;
    if (blocks.length === 0 || blocks[blocks.length - 1].role !== "assistant") return;
    // The first chunk retires this panel's loader, which lives in the same
    // wrapper as the answer and cannot be patched away in place.
    const first = waiting[event.side];
    if (first) {
      waiting[event.side] = false;
      if (!waiting.window && !waiting.facts) stopWaiting();
    }
    blocks[blocks.length - 1].content = event.content;
    if (first || !liveNodes[event.side]) {
      renderAll();
    } else {
      liveNodes[event.side].textContent = event.content;
      stickToBottom();
    }
  } else if (event.type === "status") {
    waiting[event.side] = false;
    if (!waiting.window && !waiting.facts) stopWaiting();
    panes[index].status = event.status || "";
    // Notes produced while the turn ran (an error or a facts warning) arrive
    // with the status; the server appends them to the panel's trailing note.
    const blocks = panes[index].blocks;
    const last = blocks[blocks.length - 1];
    if (last && last.role === "info") {
      last.content = event.info;
    } else if (event.info) {
      blocks.push({ role: "info", content: event.info });
    }
    renderAll();
  }
}

function closeMenu() {
  menu.classList.remove("open");
  menu.innerHTML = "";
  menuItems = [];
  menuIndex = -1;
}

function openMenu(items) {
  menuItems = items;
  menuIndex = 0;
  menu.innerHTML = "";
  items.forEach((item, i) => {
    const div = document.createElement("div");
    div.textContent = item;
    if (i === 0) div.classList.add("active");
    div.addEventListener("mousedown", (e) => { e.preventDefault(); applyMenu(i); });
    menu.appendChild(div);
  });
  menu.classList.toggle("open", items.length > 0);
}

function applyMenu(i) {
  input.value = menuItems[i];
  closeMenu();
  input.focus();
}

function updateMenu() {
  const text = input.value;
  if (!text.startsWith("/")) { closeMenu(); return; }
  if (/\s/.test(text)) { closeMenu(); return; }
  const matches = SLASH_COMMANDS.filter((c) => c.toLowerCase().startsWith(text.toLowerCase()));
  openMenu(matches);
}

input.addEventListener("input", updateMenu);

input.addEventListener("keydown", (e) => {
  if (menu.classList.contains("open")) {
    if (e.key === "ArrowDown") {
      e.preventDefault();
      menuIndex = Math.min(menuIndex + 1, menuItems.length - 1);
      [...menu.children].forEach((c, i) => c.classList.toggle("active", i === menuIndex));
      return;
    }
    if (e.key === "ArrowUp") {
      e.preventDefault();
      menuIndex = Math.max(menuIndex - 1, 0);
      [...menu.children].forEach((c, i) => c.classList.toggle("active", i === menuIndex));
      return;
    }
    if (e.key === "Tab" || (e.key === "Enter" && menuIndex >= 0)) {
      e.preventDefault();
      applyMenu(menuIndex);
      return;
    }
    if (e.key === "Escape") {
      e.preventDefault();
      closeMenu();
      return;
    }
  }
  if (e.key === "ArrowUp" && !menu.classList.contains("open")) {
    if (history.length === 0) return;
    e.preventDefault();
    historyPos = Math.max(0, (historyPos < 0 ? history.length : historyPos) - 1);
    input.value = history[historyPos] || "";
    return;
  }
  if (e.key === "ArrowDown" && !menu.classList.contains("open")) {
    if (historyPos < 0) return;
    e.preventDefault();
    historyPos++;
    if (historyPos >= history.length) { historyPos = -1; input.value = ""; }
    else input.value = history[historyPos];
    return;
  }
  if (e.key === "Enter") {
    e.preventDefault();
    submit();
  }
});

async function submit() {
  const line = input.value.trim();
  if (!line || busy) return;
  if (history[history.length - 1] !== line) history.push(line);
  historyPos = -1;
  input.value = "";
  closeMenu();
  if (line.startsWith("/")) {
    await runCommand(line);
    return;
  }
  await ask(line);
}

fetchState();
input.focus();
</script>
