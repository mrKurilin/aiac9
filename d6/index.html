<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeepSeek-агент</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0b1020;color:#e8ecf7}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}main{width:min(820px,100%);height:min(850px,calc(100vh - 40px));background:#121a2f;border:1px solid #273353;border-radius:20px;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;box-shadow:0 24px 80px #0008}header{padding:18px 22px;border-bottom:1px solid #273353;display:flex;justify-content:space-between;align-items:center}h1{font-size:18px;margin:0}.status{color:#7ee2a8;font-size:13px}#messages{overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px}.message{max-width:82%;padding:12px 15px;border-radius:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:#4f6ef7}.agent{align-self:flex-start;background:#202c49}.error{align-self:center;color:#ff9d9d;background:#431f2a}form{border-top:1px solid #273353;padding:15px;display:grid;grid-template-columns:1fr auto;gap:10px}textarea{resize:none;min-height:48px;max-height:150px;padding:13px;border:1px solid #344365;border-radius:12px;background:#0c1428;color:inherit;font:inherit}button{border:0;border-radius:12px;padding:0 18px;background:#657df7;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}#reset{padding:8px 12px;background:#273353;font-size:12px}
</style></head><body><main><header><div><h1>DeepSeek-агент</h1><span class="status">● онлайн</span></div><button id="reset">Новый диалог</button></header><section id="messages"><div class="message agent">Привет! Чем я могу помочь?</div></section><form id="form"><textarea id="input" placeholder="Введите сообщение…" required autofocus></textarea><button id="send">Отправить</button></form></main>
<script>
const messages=document.querySelector('#messages'),form=document.querySelector('#form'),input=document.querySelector('#input'),send=document.querySelector('#send');
function add(text,kind){const el=document.createElement('div');el.className=`message ${kind}`;el.textContent=text;messages.append(el);messages.scrollTop=messages.scrollHeight}
form.addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;add(text,'user');input.value='';send.disabled=true;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})}),data=await r.json();if(!r.ok)throw new Error(data.error||`HTTP ${r.status}`);add(data.answer,'agent')}catch(e){add(`Ошибка: ${e.message}`,'error')}finally{send.disabled=false;input.focus()}});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
document.querySelector('#reset').addEventListener('click',async()=>{await fetch('/api/reset',{method:'POST'});messages.replaceChildren();add('История очищена. Начнём заново!','agent')});
</script></body></html>
