<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeepSeek-агент (с памятью)</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0b1020;color:#e8ecf7}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}main{width:min(860px,100%);height:min(880px,calc(100vh - 40px));background:#121a2f;border:1px solid #273353;border-radius:20px;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;box-shadow:0 24px 80px #0008}header{padding:18px 22px;border-bottom:1px solid #273353;display:flex;justify-content:space-between;align-items:center}h1{font-size:18px;margin:0}.status{color:#7ee2a8;font-size:13px}#messages{overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px}.message{max-width:82%;padding:12px 15px;border-radius:15px;line-height:1.5;overflow-wrap:anywhere}.user{align-self:flex-end;background:#4f6ef7;white-space:pre-wrap}.agent{align-self:flex-start;background:#202c49;white-space:normal}.agent :is(h1,h2,h3,h4,h5,h6){margin:.45em 0 .2em;font-size:1.06em;line-height:1.3}.agent :is(h1,h2){font-size:1.15em}.agent p{margin:.3em 0}.agent code{background:#101a33;border:1px solid #26345a;border-radius:6px;padding:1px 5px;font-size:.9em}.agent pre{background:#0a1126;border:1px solid #26345a;border-radius:10px;padding:10px;overflow-x:auto;margin:.4em 0}.agent pre code{background:none;border:0;padding:0}.agent ul,.agent ol{margin:.3em 0;padding-left:1.35em}.agent li{margin:.15em 0}.agent a{color:#8fb1ff}.agent blockquote{margin:.3em 0;padding:2px 12px;border-left:3px solid #3a4a77;color:#b8c4e8}.agent hr{border:0;border-top:1px dashed #3a4a77;margin:.6em 0}.agent table{border-collapse:collapse;margin:.4em 0;display:block;overflow-x:auto;max-width:100%}.agent th,.agent td{border:1px solid #33406b;padding:5px 9px;text-align:left}.agent th{background:#182544}.error{align-self:center;color:#ff9d9d;background:#431f2a;white-space:pre-wrap}.banner{align-self:center;font-size:12px;color:#9fb0d8;border:1px dashed #344365;background:#0c1428;padding:6px 14px;border-radius:999px;text-align:center;max-width:94%;line-height:1.4}.banner.fresh{color:#ffd27e;border-color:#6a5522;background:#241c07}.banner.restored{color:#7ee2a8;border-color:#2e6b4a;background:#07251a}.cursor{display:inline-block;width:.6em;height:1em;margin-left:2px;vertical-align:-.1em;background:#7ea0ff;animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:0}}form{border-top:1px solid #273353;padding:15px;display:grid;grid-template-columns:1fr auto;gap:10px}textarea{resize:none;min-height:48px;max-height:150px;padding:13px;border:1px solid #344365;border-radius:12px;background:#0c1428;color:inherit;font:inherit}button{border:0;border-radius:12px;padding:0 18px;background:#657df7;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}#reset{padding:8px 12px;background:#273353;font-size:12px}
</style></head><body><main><header><div><h1>DeepSeek-агент · с памятью</h1><span class="status">● онлайн</span></div><button id="reset">Новый диалог</button></header><section id="messages"></section><form id="form"><textarea id="input" placeholder="Введите сообщение…" required autofocus></textarea><button id="send">Отправить</button></form></main>
<script>
// --- Безопасный Markdown → HTML (без внешних библиотек). Текст всегда сначала
// экранируется, поэтому содержимое модели не может внедрить произвольный HTML.
// Инлайн-код вырезается ДО экранирования и вставляется обратно как <code>,
// чтобы разметка внутри кода не обрабатывалась.
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function safeUrl(u){u=String(u||'').trim();return /^(https?:|mailto:|\/|#)/i.test(u)?u:''}
function inline(s){
  const parts=String(s).split(/(`[^`\n]+`)/g);
  return parts.map(function(p,i){
    if(i%2===1){return '<code>'+esc(p.slice(1,-1))+'</code>'}   // сегмент в обратных кавычках
    p=esc(p);
    p=p.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g,function(m,t,u){const href=safeUrl(u);return href?'<a href="'+href+'" target="_blank" rel="noopener">'+inline(t)+'</a>':m});
    p=p.replace(/~~([^~]+)~~/g,'<del>$1</del>');
    p=p.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>');
    p=p.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>').replace(/(^|[^_])_([^_\n]+)_/g,'$1<em>$2</em>');
    return p;
  }).join('');
}
function renderMarkdown(text){
  const lines=String(text||'').replace(/\r\n?/g,'\n').split('\n');
  const out=[];let para=[];let i=0;const n=lines.length;
  const flush=function(){if(para.length){out.push('<p>'+para.map(inline).join('<br>')+'</p>');para=[]}};
  const isFenceEnd=function(l){return /^```\s*$/.test(l.trim())};
  const isFence2End=function(l){return /^~~~\s*$/.test(l.trim())};
  const startUl=function(l){return /^\s*[-*+]\s+/.test(l)};
  const startOl=function(l){return /^\s*\d+[.)]\s+/.test(l)};
  const isSep=function(l){return /^\s*\|?[\s:|-]+\|?\s*$/.test(l)&&l.indexOf('-')!==-1};
  while(i<n){
    const line=lines[i];const t=line.trim();
    if(t===''){flush();i++;continue}
    let fm=/^```([\w+-]*)\s*$/.exec(t);
    if(fm){flush();const lang=fm[1];i++;const code=[];while(i<n&&!isFenceEnd(lines[i])){code.push(lines[i]);i++}i++;out.push('<pre'+(lang?' data-lang="'+lang+'"':'')+'><code>'+esc(code.join('\n'))+'</code></pre>');continue}
    fm=/^~~~([\w+-]*)\s*$/.exec(t);
    if(fm){flush();i++;const code=[];while(i<n&&!isFence2End(lines[i])){code.push(lines[i]);i++}i++;out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');continue}
    const h=/^(#{1,6})\s+(.*)$/.exec(line);
    if(h){flush();out.push('<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>');i++;continue}
    if(/^(-{3,}|\*{3,}|_{3,})\s*$/.test(t)){flush();out.push('<hr>');i++;continue}
    if(/^>\s?/.test(line)){flush();const q=[];while(i<n&&/^>\s?/.test(lines[i])){q.push(lines[i].replace(/^>\s?/,''));i++}out.push('<blockquote>'+q.map(inline).join('<br>')+'</blockquote>');continue}
    if(t.indexOf('|')!==-1&&i+1<n&&isSep(lines[i+1])){
      flush();
      const parseRow=function(l){const s=l.trim().replace(/^\|/,'').replace(/\|$/,'');return s===''?[]:s.split('|').map(function(c){return inline(c.trim())})};
      const head=parseRow(line);i+=2;const rows=[];
      while(i<n&&lines[i].trim()!==''&&lines[i].trim().indexOf('|')!==-1){rows.push(parseRow(lines[i]));i++}
      let html='<table><thead><tr>'+head.map(function(c){return '<th>'+c+'</th>'}).join('')+'</tr></thead>';
      if(rows.length){html+='<tbody>';rows.forEach(function(r){html+='<tr>'+r.map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>'});html+='</tbody>'}
      out.push(html+'</table>');continue;
    }
    if(startUl(line)||startOl(line)){
      flush();const tag=startUl(line)?'ul':'ol';let html='<'+tag+'>';
      while(i<n&&lines[i].trim()!==''&&(startUl(lines[i])||startOl(lines[i]))){
        html+='<li>'+inline(lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/,''))+'</li>';i++;
      }
      out.push(html+'</'+tag+'>');continue;
    }
    para.push(line);i++;
  }
  flush();return out.join('\n');
}
// --- DOM-часть ---
const messages=document.querySelector('#messages'),form=document.querySelector('#form'),input=document.querySelector('#input'),send=document.querySelector('#send');
function mkdiv(cls){const el=document.createElement('div');el.className=cls;return el}
function add(text,kind){const el=mkdiv('message '+kind);el.textContent=text;messages.append(el);messages.scrollTop=messages.scrollHeight}
function addMarkdown(text){const el=mkdiv('message agent');el.innerHTML=renderMarkdown(text);messages.append(el);messages.scrollTop=messages.scrollHeight}
function addBanner(text,cls){const el=mkdiv('banner '+(cls||'').trim());el.textContent=text;messages.append(el);messages.scrollTop=messages.scrollHeight}
function greeting(){addMarkdown('Привет! Чем я могу помочь?')}
function render(msgs){msgs.forEach(function(m){if(m.role==='assistant')addMarkdown(m.content);else if(m.role==='user')add(m.content,'user')})}
async function loadHistory(){
  try{
    const r=await fetch('/api/history');if(!r.ok)throw new Error('HTTP '+r.status);
    const data=await r.json(),msgs=data.messages||[];
    if(data.kind==='fresh'){addBanner('— Начата новая сессия: память пуста —','fresh');greeting()}
    else if(data.kind==='restored'){addBanner('Сервер перезапущен · начата новая сессия, история восстановлена из памяти','restored');render(msgs)}
    else if(msgs.length)render(msgs);else greeting();
  }catch(e){greeting()}
  messages.scrollTop=messages.scrollHeight
}
function sseParser(onEvent){
  let buf='';
  return function(chunk){
    buf+=chunk;let i;
    while((i=buf.indexOf('\n\n'))!==-1){
      const block=buf.slice(0,i);buf=buf.slice(i+2);
      block.split('\n').forEach(function(line){const t=line.trim();if(t.startsWith('data:')){try{onEvent(JSON.parse(t.slice(5).trim()))}catch(e){}}});
    }
  };
}
async function ask(text){
  add(text,'user');input.value='';send.disabled=true;
  try{
    const resp=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
    if(!resp.ok){const d=await resp.json().catch(()=>({}));throw new Error(d.error||('HTTP '+resp.status))}
    const ctype=resp.headers.get('Content-Type')||'';
    if(ctype.indexOf('text/event-stream')===-1){const d=await resp.json().catch(()=>({}));if(d.answer)addMarkdown(d.answer);return}
    const bubble=mkdiv('message agent');const cursor=mkdiv('cursor');bubble.append(cursor);messages.append(bubble);messages.scrollTop=messages.scrollHeight;
    const reader=resp.body.getReader(),dec=new TextDecoder();let acc='';
    const push=sseParser(function(ev){
      if(ev.error!==undefined){bubble.className='message error';bubble.textContent='Ошибка: '+ev.error;return}
      if(typeof ev.d==='string'&&ev.d.length){acc+=ev.d;bubble.innerHTML=renderMarkdown(acc);bubble.append(cursor);messages.scrollTop=messages.scrollHeight}
    });
    for(;;){const r=await reader.read();if(r.done)break;push(dec.decode(r.value,{stream:true}))}
    push(dec.decode());
    cursor.remove();
  }catch(e){add('Ошибка: '+e.message,'error')}
  finally{send.disabled=false;input.focus()}
}
form.addEventListener('submit',function(e){e.preventDefault();const text=input.value.trim();if(text)ask(text)});
input.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
document.querySelector('#reset').addEventListener('click',async function(){await fetch('/api/reset',{method:'POST'});messages.replaceChildren();addBanner('— Начата новая сессия: память очищена —','fresh');greeting()});
loadHistory();
</script></body></html>
