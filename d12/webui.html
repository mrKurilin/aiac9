<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MrKai · Сравнение профилей</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #090b10;
    --surface: #11151d;
    --surface-2: #171c26;
    --line: #283142;
    --text: #edf1f7;
    --muted: #929dad;
    --cyan: #67e8f9;
    --violet: #a78bfa;
    --amber: #fbbf24;
    --green: #6ee7b7;
    --danger: #fb7185;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    background:
      radial-gradient(circle at 8% -10%, rgba(103,232,249,.11), transparent 32rem),
      radial-gradient(circle at 95% 3%, rgba(167,139,250,.10), transparent 30rem),
      var(--bg);
    font: 14px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  button, textarea { font: inherit; }
  button { cursor: pointer; }
  .shell { width: min(1600px, 100%); margin: 0 auto; padding: 26px clamp(16px, 3vw, 44px) 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .mark {
    width: 38px; height: 38px; display: grid; place-items: center; border-radius: 13px;
    color: #071016; background: linear-gradient(135deg, var(--cyan), var(--violet));
    font-weight: 900; box-shadow: 0 0 30px rgba(103,232,249,.2);
  }
  h1 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  .ghost {
    border: 1px solid var(--line); background: rgba(17,21,29,.8); color: var(--muted);
    border-radius: 10px; padding: 8px 12px;
  }
  .ghost:hover { color: var(--text); border-color: #3d4960; }
  .profiles, .responses { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .profile {
    --accent: var(--cyan);
    min-width: 0; padding: 18px; border: 1px solid var(--line); border-radius: 16px;
    background: linear-gradient(150deg, color-mix(in srgb, var(--accent) 7%, var(--surface)), var(--surface) 55%);
    box-shadow: inset 0 1px rgba(255,255,255,.025);
  }
  .profile-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .profile h3 { margin: 0 0 3px; font-size: 17px; }
  .profile .audience { margin: 0; color: var(--muted); font-size: 12px; min-height: 38px; }
  .badge {
    flex: none; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    background: color-mix(in srgb, var(--accent) 8%, transparent); border-radius: 999px;
    padding: 3px 8px; font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
  }
  .profile ol { margin: 16px 0 0; padding: 0; list-style: none; counter-reset: rules; }
  .profile li { display: grid; grid-template-columns: 20px 1fr; gap: 7px; color: #c7cfda; font-size: 12px; margin-top: 9px; }
  .profile li::before {
    counter-increment: rules; content: counter(rules); color: var(--accent); font-size: 10px;
    width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%;
    background: color-mix(in srgb, var(--accent) 11%, transparent);
  }
  .lab {
    margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 18px;
    background: rgba(17,21,29,.78); backdrop-filter: blur(14px);
  }
  .lab-head { display: flex; justify-content: space-between; gap: 16px; align-items: end; margin-bottom: 12px; }
  .lab-head h3 { margin: 0; font-size: 14px; }
  .lab-head span { color: var(--muted); font-size: 11px; }
  .examples { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
  .example {
    border: 1px solid var(--line); color: #bac3d0; background: var(--surface-2);
    padding: 7px 10px; border-radius: 999px; text-align: left; font-size: 11px;
  }
  .example:hover { border-color: var(--cyan); color: var(--text); }
  .composer { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; }
  textarea {
    width: 100%; min-height: 70px; resize: vertical; padding: 12px 14px;
    color: var(--text); background: #0d1118; border: 1px solid var(--line); border-radius: 12px;
  }
  textarea:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(103,232,249,.08); }
  .send {
    align-self: stretch; min-width: 160px; border: 0; border-radius: 12px; color: #061014;
    background: linear-gradient(135deg, var(--cyan), #8be8c8); font-weight: 800; padding: 12px 17px;
  }
  .send:hover { filter: brightness(1.06); }
  .send:disabled { opacity: .45; cursor: wait; }
  .hint { margin: 8px 2px 0; color: var(--muted); font-size: 11px; }
  .section-title { display: flex; align-items: center; gap: 12px; margin: 28px 0 12px; }
  .section-title h2 { margin: 0; font-size: 17px; }
  .section-title span { color: var(--muted); font-size: 11px; }
  .response {
    --accent: var(--cyan); min-width: 0; min-height: 390px; display: grid; grid-template-rows: auto minmax(0,1fr);
    border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--surface);
  }
  .response-head { padding: 13px 15px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
  .response-head strong { color: var(--accent); }
  .status { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
  .status.running { color: var(--amber); }
  .status.done { color: var(--green); }
  .status.error { color: var(--danger); }
  .answer { padding: 17px; overflow-wrap: anywhere; color: #dbe1ea; }
  .answer.empty { display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 12px; }
  .answer p { margin: 0 0 .8em; }
  .answer p:last-child { margin-bottom: 0; }
  .answer h1, .answer h2, .answer h3 { margin: 1em 0 .35em; line-height: 1.25; color: var(--text); }
  .answer h1:first-child, .answer h2:first-child, .answer h3:first-child { margin-top: 0; }
  .answer ul, .answer ol { padding-left: 22px; }
  .answer pre { overflow-x: auto; padding: 11px; border: 1px solid var(--line); border-radius: 9px; background: #090c11; }
  .answer code { color: var(--cyan); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .answer :not(pre) > code { padding: 1px 4px; border-radius: 4px; background: #090c11; }
  .answer blockquote { margin: .8em 0; padding-left: 11px; color: var(--muted); border-left: 3px solid var(--accent); }
  .answer a { color: var(--cyan); }
  .typing::after { content: "●"; margin-left: 7px; color: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (max-width: 1050px) {
    .profiles, .responses { grid-template-columns: 1fr; }
    .profile .audience { min-height: auto; }
    .response { min-height: 260px; }
  }
  @media (max-width: 650px) {
    header { align-items: flex-start; }
    .composer { grid-template-columns: 1fr; }
    .send { min-height: 48px; }
    .lab-head, .section-title { align-items: flex-start; flex-direction: column; gap: 3px; }
  }
</style>
</head>
<body>
<main class="shell">
  <header>
    <div class="brand">
      <div class="mark">M</div>
      <h1>MrKai</h1>
    </div>
    <button class="ghost" id="reset" type="button">Очистить диалоги</button>
  </header>

  <section class="profiles" id="profiles" aria-label="Три профиля пользователей"></section>

  <div class="section-title">
    <h2>Ответы профилей</h2>
    <span>Колонки заполняются независимо по мере генерации</span>
  </div>
  <section class="responses" id="responses" aria-live="polite"></section>

  <section class="lab">
    <div class="lab-head">
      <h3>Общий запрос для всех профилей</h3>
      <span>Будут выполнены три независимых LLM-запроса</span>
    </div>
    <div class="examples" id="examples" aria-label="Примеры запросов"></div>
    <div class="composer">
      <textarea id="prompt" maxlength="8000" placeholder="Спросите что-нибудь об алгоритмах…"></textarea>
      <button class="send" id="send" type="button">Отправить всем</button>
    </div>
    <div class="hint">Enter — отправить · Shift+Enter — новая строка</div>
  </section>

</main>

<script>
const profilesRoot = document.getElementById("profiles");
const responsesRoot = document.getElementById("responses");
const examplesRoot = document.getElementById("examples");
const promptInput = document.getElementById("prompt");
const sendButton = document.getElementById("send");
const resetButton = document.getElementById("reset");
let profiles = [];
let busy = false;

function node(tag, className, text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text !== undefined) element.textContent = text;
  return element;
}

function appendInline(parent, text) {
  const pattern = /(`[^`\n]+`|\*\*[^*\n]+\*\*|\*[^*\n]+\*|\[[^\]\n]+\]\(https?:\/\/[^)\s]+\))/g;
  let cursor = 0;
  for (const match of text.matchAll(pattern)) {
    parent.append(document.createTextNode(text.slice(cursor, match.index)));
    const part = match[0];
    if (part.startsWith("`")) parent.append(node("code", "", part.slice(1, -1)));
    else if (part.startsWith("**")) parent.append(node("strong", "", part.slice(2, -2)));
    else if (part.startsWith("*")) parent.append(node("em", "", part.slice(1, -1)));
    else {
      const split = part.indexOf("](");
      const link = node("a", "", part.slice(1, split));
      link.href = part.slice(split + 2, -1);
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      parent.append(link);
    }
    cursor = match.index + part.length;
  }
  parent.append(document.createTextNode(text.slice(cursor)));
}

function renderMarkdown(container, markdown) {
  container.replaceChildren();
  const lines = markdown.replace(/\r\n?/g, "\n").split("\n");
  let fenced = false;
  let code = [];
  let list = null;
  const closeList = () => { list = null; };
  for (const line of lines) {
    if (/^\s*```/.test(line)) {
      closeList();
      if (fenced) {
        const pre = node("pre");
        pre.append(node("code", "", code.join("\n")));
        container.append(pre);
        code = [];
      }
      fenced = !fenced;
      continue;
    }
    if (fenced) { code.push(line); continue; }
    const heading = line.match(/^(#{1,3})\s+(.+)$/);
    const bullet = line.match(/^\s*[-*+]\s+(.+)$/);
    const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
    if (heading) {
      closeList();
      const h = node("h" + heading[1].length);
      appendInline(h, heading[2]);
      container.append(h);
    } else if (bullet || ordered) {
      const tag = ordered ? "ol" : "ul";
      if (!list || list.tagName.toLowerCase() !== tag) {
        list = node(tag);
        container.append(list);
      }
      const item = node("li");
      appendInline(item, (bullet || ordered)[1]);
      list.append(item);
    } else if (line.startsWith("> ")) {
      closeList();
      const quote = node("blockquote");
      appendInline(quote, line.slice(2));
      container.append(quote);
    } else if (line.trim()) {
      closeList();
      const paragraph = node("p");
      appendInline(paragraph, line);
      container.append(paragraph);
    } else {
      closeList();
    }
  }
  if (code.length) {
    const pre = node("pre");
    pre.append(node("code", "", code.join("\n")));
    container.append(pre);
  }
}

function responseElements(id) {
  const root = document.querySelector('[data-response="' + id + '"]');
  return {
    root,
    status: root.querySelector(".status"),
    answer: root.querySelector(".answer")
  };
}

function renderProfiles() {
  profilesRoot.replaceChildren();
  responsesRoot.replaceChildren();
  profiles.forEach((profile) => {
    const card = node("article", "profile");
    card.style.setProperty("--accent", profile.accent);
    const head = node("div", "profile-head");
    const intro = node("div");
    intro.append(node("h3", "", profile.name), node("p", "audience", profile.audience));
    head.append(intro, node("span", "badge", profile.id));
    const rules = node("ol");
    profile.rules.forEach((rule) => rules.append(node("li", "", rule)));
    card.append(head, rules);
    profilesRoot.append(card);

    const response = node("article", "response");
    response.dataset.response = profile.id;
    response.style.setProperty("--accent", profile.accent);
    const responseHead = node("div", "response-head");
    responseHead.append(node("strong", "", profile.name), node("span", "status", "ожидает"));
    response.append(responseHead, node("div", "answer empty", "Здесь появится персонализированный ответ."));
    responsesRoot.append(response);
  });
}

function setResponseState(profile, state, text) {
  const elements = responseElements(profile.id);
  elements.status.className = "status " + state;
  elements.status.textContent = state === "running" ? "генерируется" : state === "done" ? "готово" : state === "error" ? "ошибка" : "ожидает";
  if (text !== undefined) {
    elements.answer.className = "answer" + (text ? "" : " empty");
    if (state === "error") elements.answer.textContent = text;
    else if (text) renderMarkdown(elements.answer, text);
    else elements.answer.textContent = "Здесь появится персонализированный ответ.";
  }
  elements.answer.classList.toggle("typing", state === "running");
}

async function askProfile(profile, prompt) {
  setResponseState(profile, "running", "");
  const response = await fetch("/api/profiles/" + encodeURIComponent(profile.id) + "/ask", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ prompt })
  });
  if (!response.ok || !response.body) {
    let message = "Запрос не выполнен";
    try { message = (await response.json()).error || message; } catch (_) {}
    throw new Error(message);
  }
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  let answer = "";
  for (;;) {
    const part = await reader.read();
    buffer += decoder.decode(part.value || new Uint8Array(), { stream: !part.done });
    const events = buffer.split("\n\n");
    buffer = events.pop() || "";
    for (const raw of events) {
      const line = raw.trim();
      if (!line.startsWith("data:")) continue;
      const event = JSON.parse(line.slice(5));
      if (event.type === "delta") {
        answer += event.content;
        setResponseState(profile, "running", answer);
      }
      if (event.type === "error") throw new Error(event.content);
      if (event.type === "memory_warning") console.warn(profile.id + ": memory:", event.content);
      if (event.type === "tool") console.info(profile.id + ": source:", event.content);
    }
    if (part.done) break;
  }
  setResponseState(profile, "done", answer);
}

async function submit() {
  const prompt = promptInput.value.trim();
  if (!prompt || busy) return;
  busy = true;
  sendButton.disabled = true;
  sendButton.textContent = "Сравниваем…";
  const jobs = profiles.map(async (profile) => {
    try {
      await askProfile(profile, prompt);
    } catch (error) {
      setResponseState(profile, "error", error.message || String(error));
    }
  });
  await Promise.allSettled(jobs);
  busy = false;
  sendButton.disabled = false;
  sendButton.textContent = "Отправить всем";
}

async function initialize() {
  const response = await fetch("/api/profiles");
  if (!response.ok) throw new Error("Не удалось загрузить профили");
  const data = await response.json();
  profiles = data.profiles;
  renderProfiles();
  examplesRoot.replaceChildren();
  data.prompts.forEach((prompt) => {
    const button = node("button", "example", prompt);
    button.type = "button";
    button.addEventListener("click", () => {
      promptInput.value = prompt;
      promptInput.focus();
    });
    examplesRoot.append(button);
  });
  if (data.prompts.length) promptInput.value = data.prompts[0];
}

sendButton.addEventListener("click", submit);
promptInput.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    submit();
  }
});
resetButton.addEventListener("click", async () => {
  resetButton.disabled = true;
  try {
    const response = await fetch("/api/reset", { method: "POST" });
    if (!response.ok) throw new Error("Не удалось очистить диалоги");
    profiles.forEach((profile) => setResponseState(profile, "idle", ""));
  } finally {
    resetButton.disabled = false;
  }
});

initialize().catch((error) => {
  profilesRoot.append(node("p", "", error.message || String(error)));
});
</script>
</body>
</html>
